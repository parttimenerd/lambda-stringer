name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn package --no-transfer-progress

  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build jar (skip tests — already passed in build job)
        run: mvn package -DskipTests --no-transfer-progress

      - name: Delete previous latest tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Publish per-commit release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          DATE="$(git log -1 --format='%as')"
          SUBJECT="$(git log -1 --format='%s')"
          BODY="$(git log -1 --format='%b')"
          gh release create "v0-${SHORT}" \
            --title "${SUBJECT} (${DATE})" \
            --notes "${BODY}Commit: \`${SHA}\`" \
            target/lambda-stringer-1.0.jar#lambda-stringer-1.0.jar
          # Also update the floating "latest" tag to this release for easy wget access.
          gh release create latest \
            --title "Latest: ${SUBJECT} (${DATE})" \
            --notes "Latest build. See [v0-${SHORT}](https://github.com/${{ github.repository }}/releases/tag/v0-${SHORT}) for details." \
            --prerelease \
            target/lambda-stringer-1.0.jar#lambda-stringer-1.0.jar
